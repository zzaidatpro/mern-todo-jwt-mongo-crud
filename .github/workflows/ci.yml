name: Pipeline CI/CD - GreenForest

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ----------------------------------------------------
  # JOB 1 : Tests Backend avec Jest
  # ----------------------------------------------------
  backend-tests:
    name: 🧪 Tests Backend (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances du Backend
        run: npm ci
        working-directory: backend

      - name: Exécuter les tests Jest
        run: npm test
        working-directory: backend
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MONGO_URI: ${{ secrets.MONGO_URI }}

  # ----------------------------------------------------
  # JOB 2 : Tests E2E avec Playwright
  # ----------------------------------------------------
  e2e-tests:
    name: 🎭 Tests E2E (Playwright)
    needs: backend-tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances (Backend, Frontend, Racine)
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci || npm install @playwright/test

      - name: Pré-construire le Frontend (Evite le timeout Vite)
        run: npm run build --prefix frontend

      - name: Cache des navigateurs Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Installer les navigateurs Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Installer les dépendances système Playwright si cache actif
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Exécuter les tests Playwright
        run: npx playwright test
        env:
          CI: true
          PORT: 5000
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MONGO_URI: ${{ secrets.MONGO_URI }}

      - name: Archiver le rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7