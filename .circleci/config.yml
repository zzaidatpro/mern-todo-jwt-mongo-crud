version: 2.1

executors:
  node-executor:
    docker:
      # Passage à v20.18.0 (ou v24.0.0) pour inclure util.styleText (disponible dès v20.12.0)
      - image: cimg/node:20.18.0
    working_directory: ~/project

jobs:
  # ----------------------------------------------------
  # JOB 1 : Tests Backend (Jest)
  # ----------------------------------------------------
  backend-tests:
    executor: node-executor
    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-backend-deps-{{ checksum "backend/package-lock.json" }}
            - v1-backend-deps-

      - run:
          name: Installer les dépendances du Backend
          command: npm ci
          working_directory: backend

      - save_cache:
          key: v1-backend-deps-{{ checksum "backend/package-lock.json" }}
          paths:
            - backend/node_modules

      - run:
          name: Exécuter les tests Jest
          command: npm test
          working_directory: backend
          environment:
            JWT_SECRET: $JWT_SECRET
            MONGO_URI: $MONGO_URI

  # ----------------------------------------------------
  # JOB 2 : Tests E2E (Playwright)
  # ----------------------------------------------------
  e2e-tests:
    executor: node-executor
    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-root-deps-{{ checksum "package-lock.json" }}
            - v1-backend-deps-{{ checksum "backend/package-lock.json" }}
            - v1-frontend-deps-{{ checksum "frontend/package-lock.json" }}

      - run:
          name: Installer les dépendances
          command: |
            npm ci --prefix backend
            npm install --prefix frontend
            npm ci || npm install @playwright/test

      - save_cache:
          key: v1-root-deps-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
            - backend/node_modules
            - frontend/node_modules

      - run:
          name: Installer les dépendances système et navigateurs Playwright
          command: npx playwright install --with-deps chromium

      - run:
          name: Pré-construire le Frontend (Vite)
          command: npm run build
          working_directory: frontend

      - run:
          name: Exécuter les tests Playwright E2E
          command: npx playwright test
          environment:
            CI: "true"
            PORT: "5000"
            JWT_SECRET: $JWT_SECRET
            MONGO_URI: $MONGO_URI

      - store_artifacts:
          path: playwright-report
          destination: playwright-report

# ----------------------------------------------------
# WORKFLOW CIRCLECI
# ----------------------------------------------------
workflows:
  greenforest-pipeline:
    jobs:
      - backend-tests
      - e2e-tests:
          requires:
            - backend-tests