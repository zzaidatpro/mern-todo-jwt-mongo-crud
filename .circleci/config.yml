version: 2.1

# Définition des images réutilisables
executors:
  node-executor:
    docker:
      - image: cimg/node:20.11.1
    working_directory: ~/project

  playwright-executor:
    docker:
      # Utilisation de l'image officielle Playwright fournie par Microsoft
      - image: mcr.microsoft.com/playwright:v1.63.0-jammy
    working_directory: ~/project

jobs:
  # ----------------------------------------------------
  # JOB 1 : Tests Backend avec Jest
  # ----------------------------------------------------
  backend-tests:
    executor: node-executor
    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-backend-deps-{{ checksum "backend/package-lock.json" }}
            - v1-backend-deps-

      - run:
          name: Installer les dépendances du Backend
          command: npm ci
          working_directory: backend

      - save_cache:
          key: v1-backend-deps-{{ checksum "backend/package-lock.json" }}
          paths:
            - backend/node_modules

      - run:
          name: Exécuter les tests Jest
          command: npm test
          working_directory: backend
          environment:
            JWT_SECRET: $JWT_SECRET
            MONGO_URI: $MONGO_URI

  # ----------------------------------------------------
  # JOB 2 : Tests E2E avec Playwright
  # ----------------------------------------------------
  e2e-tests:
    executor: playwright-executor
    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-root-deps-{{ checksum "package-lock.json" }}
            - v1-backend-deps-{{ checksum "backend/package-lock.json" }}
            - v1-frontend-deps-{{ checksum "frontend/package-lock.json" }}

      - run:
          name: Installer toutes les dépendances
          command: |
            npm ci --prefix backend
            npm ci --prefix frontend
            npm ci || npm install @playwright/test

      - save_cache:
          key: v1-root-deps-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
            - backend/node_modules
            - frontend/node_modules

      - run:
          name: Pré-construire le Frontend (Vite)
          command: npm run build
          working_directory: frontend

      - run:
          name: Exécuter les tests Playwright E2E
          command: npx playwright test
          environment:
            CI: "true"
            PORT: "5000"
            JWT_SECRET: $JWT_SECRET
            MONGO_URI: $MONGO_URI

      - store_artifacts:
          path: playwright-report
          destination: playwright-report

# ----------------------------------------------------
# WORKFLOW CIRCLECI
# ----------------------------------------------------
workflows:
  greenforest-pipeline:
    jobs:
      - backend-tests
      - e2e-tests:
          requires:
            - backend-tests