version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:22.14.0
    working_directory: ~/project

jobs:
  # ----------------------------------------------------
  # JOB 1 : Tests Backend (Jest)
  # ----------------------------------------------------
  backend-tests:
    executor: node-executor
    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-backend-deps-{{ checksum "backend/package-lock.json" }}
            - v1-backend-deps-

      - run:
          name: Installer les dépendances du Backend
          command: npm ci
          working_directory: backend

      - save_cache:
          key: v1-backend-deps-{{ checksum "backend/package-lock.json" }}
          paths:
            - backend/node_modules

      - run:
          name: Exécuter les tests Jest
          command: npm test
          working_directory: backend
          environment:
            JWT_SECRET: $JWT_SECRET
            MONGO_URI: $MONGO_URI

  # ----------------------------------------------------
  # JOB 2 : Tests E2E (Playwright)
  # ----------------------------------------------------
  e2e-tests:
    executor: node-executor
    steps:
      - checkout

      # Restauration du cache basé UNIQUEMENT sur backend et frontend
      - restore_cache:
          keys:
            - v1-e2e-deps-{{ checksum "backend/package-lock.json" }}-{{ checksum "frontend/package-lock.json" }}
            - v1-e2e-deps-

      - run:
          name: Installer les dépendances Backend et Frontend
          command: |
            npm ci --prefix backend
            npm ci --prefix frontend

      - save_cache:
          key: v1-e2e-deps-{{ checksum "backend/package-lock.json" }}-{{ checksum "frontend/package-lock.json" }}
          paths:
            - backend/node_modules
            - frontend/node_modules

      - run:
          name: Installer les dépendances système et navigateurs Playwright
          command: npx --prefix frontend playwright install --with-deps chromium

      - run:
          name: Pré-construire le Frontend (Vite)
          command: npm run build
          working_directory: frontend

      - run:
          name: Exécuter les tests Playwright E2E
          command: npx playwright test
          working_directory: frontend
          environment:
            CI: "true"
            PORT: "5000"
            JWT_SECRET: $JWT_SECRET
            MONGO_URI: $MONGO_URI

      - store_artifacts:
          path: frontend/playwright-report
          destination: playwright-report

# ----------------------------------------------------
# WORKFLOW CIRCLECI
# ----------------------------------------------------
workflows:
  greenforest-pipeline:
    jobs:
      - backend-tests
      - e2e-tests:
          requires:
            - backend-tests